[project]
name = "mcp-pjqaqc"
version = "0.1.0"
description = "MCP server that knows the PJQAQC laboratory QA/QC schema and answers questions from it, read-only"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pymysql>=1.1,<2",
    "python-dotenv>=1.0,<2",
    "sqlglot>=30,<31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcp-pjqaqc = "mcp_pjqaqc.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_pjqaqc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["database: needs the local test database (set PJQAQC_ENV_FILE or .env)"]
